# TLS 终结（规范 §15）：仅由 docker-compose.prod.yml 挂载启用
# 证书置于 backend/certs/（gitignore）：fullchain.pem / privkey.pem
#
# ⚠️ 已知问题（收尾计划书 §四 B5）：下方 `proxy_pass http://backend;` 是坏上游——
# Docker 网络里没有 `backend` 主机名（nginx 别名只有 nginx，后端是 app）。
# 演示版不挂载本文件（走 HTTP）不受影响；将来启用 HTTPS 前必须先改为：
#   resolver 127.0.0.11 valid=10s ipv6=off;
#   set $backend "app:8006";
#   location /api/ { proxy_pass http://$backend; ... }

server {
    listen 443 ssl;
    server_name _;
    http2 on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
