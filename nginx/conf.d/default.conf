# 后端上游：用 Docker 内置 DNS 动态解析，避免 app 容器重建后 IP 变化导致 502。
# 静态 upstream 只在 nginx 启动时解析一次；app 每次 `up -d --build` 都会 Recreate
# 拿到新 IP，旧 IP 被 nginx 缓存后反复 502。改用 resolver + 变量后每次请求前
# 由 Docker DNS（127.0.0.11）按 valid 周期重新解析。
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 内置 DNS
    set $backend "app:8006";

    # 上传上限对齐：简历 10MB / 头像 2MB（规范 §15）
    client_max_body_size 12m;

    # nginx 自身健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 后端 API 反向代理（含 SSE 流式，规范 §8.2/§15）
    location /api/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # SSE：关闭缓冲 + 长连接超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端 SPA（M1 构建产物挂载 /usr/share/nginx/html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 带指纹静态资源长期缓存（规范 §15 压缩缓存）
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
