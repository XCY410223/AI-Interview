# =============================================================================
# 开发覆盖层（规范 §15：挂载源码热重载）
#
# 用法（在 backend/ 目录下执行）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 覆盖内容：
#   - app / celery 改用 Dockerfile.dev（含 dev 依赖 + uvicorn --reload）
#   - 挂载 ./:/app 源码热重载；app 额外发布 8006 供本地直连
#   - APP_ENV=development、DEBUG=true
#   - Mailpit：SMTP 1025 / Web UI 8025（忘记密码找回邮件，§3.1）
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-interview/app:dev
    environment:
      APP_ENV: development
      DEBUG: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "AI-Interview <noreply@example.com>"
    ports:
      - "8006:8006"
    volumes:
      - .:/app

  celery-worker:
    image: ai-interview/app:dev
    environment:
      APP_ENV: development
      DEBUG: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "AI-Interview <noreply@example.com>"
    volumes:
      - .:/app

  celery-beat:
    image: ai-interview/app:dev
    environment:
      APP_ENV: development
      DEBUG: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "AI-Interview <noreply@example.com>"
    volumes:
      - .:/app

  # ---- Mailpit：本地 SMTP 调试（忘记密码找回，§3.1）----
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - backend
