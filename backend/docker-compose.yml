# =============================================================================
# AI-Interview 生产配置基线（规范 §15）
#
# 服务清单：app / celery-worker / celery-beat / postgres / redis / nginx
#           可选 flower（--profile flower）、定期备份 backup（--profile backup）
#
# 要求落实：
#   - 所有服务配 healthcheck；app 依赖 postgres/redis `service_healthy`
#   - 生产容器非 root（app 镜像 uid/gid 10001）；镜像多阶段构建（builder -> runtime）
#   - 生产 gunicorn -k uvicorn.workers.UvicornWorker -w 4；健康端点 /api/v1/health
#   - 端口规划：FastAPI 8006 / PostgreSQL 5434 / Redis 6382 / Nginx 80（443 见 prod 覆盖层）
#
# 使用（在 backend/ 目录下执行，相对路径 ../nginx 以此解析）：
#   cp .env.example .env        # 首次：生成本地配置（真实密钥不入库；缺 .env 也能用默认值起）
#   docker compose up -d --build    # 一条命令起全栈
#
# 开发：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 生产加固（TLS，证书放 backend/certs/）：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 说明：env_file 的 required:false 需 Docker Compose >= 2.24（Docker Desktop 4.29+）
# =============================================================================

name: ai-interview

# 后端服务共享的构建与通用配置（app / celery-worker / celery-beat / flower 复用）
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: ai-interview/app:latest
  restart: unless-stopped
  env_file:
    - path: .env            # 密钥/LLM/S3/SMTP（本地生成，gitignore）
      required: false       # 缺省则用 pydantic 默认值，保证 docker compose up 无需 .env 也能起
  networks:
    - backend

# 容器内服务发现地址（覆盖 .env 里的 localhost/宿主端口，指向 docker 网络）
x-app-env: &app-env
  APP_ENV: production
  DEBUG: "false"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  # ---- Web 应用（gunicorn 多 worker，非 root，命令见 Dockerfile）----
  app:
    <<: *backend
    environment:
      <<: *app-env
    expose:
      - "8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # healthcheck 由 Dockerfile 的 HEALTHCHECK 提供（curl /api/v1/health）

  # ---- Celery Worker（简历解析/报告生成等异步任务）----
  celery-worker:
    <<: *backend
    environment:
      <<: *app-env
    command:
      ["celery", "-A", "app.tasks.celery_app:celery_app", "worker",
       "--loglevel=info", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL",
         "celery -A app.tasks.celery_app:celery_app inspect ping --timeout 5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---- Celery Beat（定时任务调度，schedule 落盘到持久卷）----
  celery-beat:
    <<: *backend
    environment:
      <<: *app-env
    command:
      ["celery", "-A", "app.tasks.celery_app:celery_app", "beat",
       "--loglevel=info", "--schedule=/home/app/celerybeat/schedule"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - celerybeat_data:/home/app/celerybeat
    healthcheck:
      test:
        ["CMD-SHELL",
         "pgrep -f 'celery -A app.tasks.celery_app:celery_app beat' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---- PostgreSQL 16 + pgvector（规范 §5）----
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ---- Redis 7（缓存 + Celery broker + 验证码，规范 §5）----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---- Nginx（反向代理 + 静态资源；TLS 见 prod 覆盖层，规范 §15）----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # M1 前端构建产物挂载：- ../frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ---- Celery Flower 监控（可选，--profile flower）----
  flower:
    <<: *backend
    environment:
      <<: *app-env
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "flower", "--port=5555"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5555:5555"
    profiles: ["flower"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5555/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- 定期 pg_dump 备份（可选，--profile backup，规范 §15）----
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-ai_interview}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["while true; do bash /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["backup"]
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
  backup_data:
